aid: akeana
name: Akeana
description: 'Akeana is a semiconductor IP company building high-performance RISC-V
  processor system IP, with the stated mission of elevating RISC-V to world-class
  performance levels. It licenses customizable processor cores across three families
  (the ultra-low-power 100 Series for deeply embedded controllers, the 1000 Series
  for high-performance edge AI and automotive compute, and the ultra-high-performance
  5000 Series for data center, networking, and mobile application processors), plus
  hardware accelerator IP, AMBA-compliant interconnect fabric IP (AXI, ACE, CHI),
  and system IP (interrupt controllers, IOMMU, PCIe, UCIe). Backed by Kleiner Perkins
  and Mayfield, Akeana partners with Samsung Foundry, Canonical, Innatera, Axiomise,
  and proteanTecs. Headquartered in Santa Clara, California.'
